name: Deploy Mega Millions tool to GitHub Pages

# Deploys ONLY the static mega-millions/ folder to GitHub Pages, independent of
# the Astro site on main. After the first run, set Settings → Pages → Source to
# "GitHub Actions".

on:
  push:
    branches: [claude/mega-millions-frequency-gec4t3]
    paths:
      - "mega-millions/**"
      - ".github/workflows/deploy-mega-millions.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mega-millions
      - id: deployment
        uses: actions/deploy-pages@v4
